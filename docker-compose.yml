services:
  # Backend Service (FastAPI)
  app:
    build:
      context: .
      dockerfile: ./BackEnd/Dockerfile
    container_name: job-boost-app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./BackEnd:/app
      - ./uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend Service (React)
  frontend:
    build:
      context: .
      dockerfile: ./FrontEnd/Dockerfile
    container_name: job-boost-frontend
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production

  # The Celery worker service
  # worker:
  #   build:
  #     context: .
  #     dockerfile: ./Celery-Worker/Dockerfile
  #   container_name: job-boost-worker
  #   command: celery -A celery_app worker --loglevel=info
  #   env_file:
  #     - ./.env
  #   depends_on:
  #     - redis
  #     - postgres

  # The Celery beat scheduler service
  # beat:
  #   build:
  #     context: .
  #     dockerfile: ./Celery-Beat/Dockerfile
  #   container_name: job-boost-beat
  #   command: celery -A celery_app beat --loglevel=info
  #   volumes:
  #     - celery_data:/app/celery_data
  #   env_file:
  #     - ./.env
  #   depends_on:
  #     - redis
  #     - postgres

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: job-boost-postgres
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: job-boost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  celery_data: